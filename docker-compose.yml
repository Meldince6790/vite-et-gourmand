services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - vite-gourmand

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-vite}
      DB_PASSWORD: ${DB_PASSWORD:-vite}
      DB_NAME: ${DB_NAME:-vite_gourmand}
      MONGO_URI: mongodb://mongo:27017/vite_gourmand
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-secret}
      JWT_EXPIRES: ${JWT_EXPIRES:-24h}
      EMAIL_PROVIDER: log
      EMAIL_FROM: "Vite & Gourmand <onboarding@resend.dev>"
      CONTACT_TO: contact@example.com
      FRONTEND_URL: http://localhost:5173
      ORS_API_KEY: ${ORS_API_KEY:-}
      ORS_BASE_URL: ${ORS_BASE_URL:-https://api.openrouteservice.org}
      ORS_TIMEOUT_MS: ${ORS_TIMEOUT_MS:-8000}
      CATERER_ADDRESS: ${CATERER_ADDRESS:-1 rue du Traiteur, 33000 Bordeaux, France}
      CATERER_LATITUDE: ${CATERER_LATITUDE:-44.8378}
      CATERER_LONGITUDE: "${CATERER_LONGITUDE:--0.5792}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - vite-gourmand

  mysql:
    image: mariadb:10.11
    ports:
      # Host 3307 avoids clash with a local XAMPP/MySQL on 3306
      - "3307:3306"
    environment:
      MYSQL_DATABASE: vite_gourmand
      MYSQL_USER: ${DB_USER:-vite}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vite}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootchangeme}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/vite_gourmand.sql:/docker-entrypoint-initdb.d/01-vite_gourmand.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - vite-gourmand

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - vite-gourmand

networks:
  vite-gourmand:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  frontend_node_modules:
  backend_node_modules:
